name: Feature request
description: Suggest an improvement for Codex Usage Monitor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any alternatives or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, or other context if useful. Do not include private information.
